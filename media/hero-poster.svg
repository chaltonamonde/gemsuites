<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE"/>
      <stop offset="40%" stop-color="#BAE6FD"/>
      <stop offset="80%" stop-color="#7DD3FC"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="azureGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0369A1"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8C27A"/>
      <stop offset="100%" stop-color="#F3D99F"/>
    </linearGradient>
  </defs>
  <!-- Background Canvas -->
  <rect width="1600" height="900" fill="url(#skyGrad)"/>
  
  <!-- Architectural Skyline & Cloud Arcs -->
  <g opacity="0.45" stroke="#0369A1" stroke-width="1.5" fill="none">
    <rect x="200" y="240" width="1200" height="520" rx="16"/>
    <line x1="200" y1="380" x2="1400" y2="380"/>
    <line x1="200" y1="520" x2="1400" y2="520"/>
    <line x1="200" y1="660" x2="1400" y2="660"/>
    <line x1="500" y1="240" x2="500" y2="760"/>
    <line x1="800" y1="240" x2="800" y2="760"/>
    <line x1="1100" y1="240" x2="1100" y2="760"/>
    <!-- Celestial Sun Arc -->
    <circle cx="800" cy="380" r="160" stroke-dasharray="4 8"/>
  </g>

  <!-- Central Crest & Typography -->
  <circle cx="800" cy="410" r="72" fill="#F0F9FF" stroke="url(#azureGrad)" stroke-width="2.5" filter="drop-shadow(0 8px 24px rgba(3,105,161,0.18))"/>
  <circle cx="800" cy="410" r="64" fill="none" stroke="url(#goldGrad)" stroke-width="1.2"/>
  <text x="800" y="426" font-family="'Cormorant Garamond', Georgia, serif" font-size="44" font-weight="700" fill="#0369A1" text-anchor="middle">GS</text>
  
  <text x="800" y="525" font-family="'Cormorant Garamond', Georgia, serif" font-size="34" font-weight="600" fill="#0B2545" text-anchor="middle" letter-spacing="1">GEMSUITES RIVERSIDE</text>
  <text x="800" y="565" font-family="'JetBrains Mono', monospace" font-size="14" fill="#0284C7" text-anchor="middle" letter-spacing="4">COOL SKY LUXURY • RIVERSIDE LANE • NAIROBI</text>
</svg>
